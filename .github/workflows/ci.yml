name: CI

on:
  push:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  repository-structure:
    name: Repository structure
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Validate root files
        shell: bash
        run: |
          set -euo pipefail

          test -f README.md
          test -f .gitignore
          test -f .env.example

      - name: Validate project directories
        shell: bash
        run: |
          set -euo pipefail

          test -d apps
          test -d services
          test -d docs/adr
          test -d .github/workflows

      - name: Validate architecture decision records
        shell: bash
        run: |
          set -euo pipefail

          test -f docs/adr/ADR-001-rust-axum-backend.md
          test -f docs/adr/ADR-002-modular-monolith.md
          test -f docs/adr/ADR-003-postgresql-postgis.md
          test -f docs/adr/ADR-004-docker.md
          test -f docs/adr/ADR-005-supabase.md
          test -f docs/adr/ADR-006-vercel-railway.md
          test -f docs/adr/ADR-007-inventory-ledger.md
          test -f docs/adr/ADR-008-transactional-outbox.md
          test -f docs/adr/ADR-009-arca-read-only.md
          test -f docs/adr/ADR-010-finnegans-adapter.md
          test -f docs/adr/ADR-011-pwa-online-first.md
          test -f docs/adr/ADR-012-github-ci.md

      - name: Ensure local environment files are not tracked
        shell: bash
        run: |
          set -euo pipefail

          if git ls-files | grep -E '(^|/)\.env$|(^|/)\.env\.local$|(^|/)\.env\..*\.local$'; then
            echo "A local environment file is tracked by Git."
            exit 1
          fi

          echo "No local environment files are tracked."
  backend-rust:
    name: Backend Rust
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_USER: agro_ops
          POSTGRES_PASSWORD: agro_ops
          POSTGRES_DB: agro_ops
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U agro_ops -d agro_ops"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgres://agro_ops:agro_ops@localhost:5432/agro_ops

    defaults:
      run:
        working-directory: services/backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.0
          components: rustfmt, clippy

      - name: Install SQLx CLI
        run: >-
          cargo install sqlx-cli --version 0.9.0 --no-default-features
          --features rustls,postgres --locked

      - name: Apply database migrations
        run: sqlx migrate run --source migrations

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Check compilation
        run: cargo check --locked --all-targets

      - name: Run tests
        run: cargo test --locked --all-targets

      - name: Run Clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

  frontend-web:
    name: Frontend Web
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: apps/web

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Enable Corepack
        run: corepack enable

      - name: Verify pnpm version
        run: test "$(pnpm --version)" = "11.25.0"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run lint
        run: pnpm lint

      - name: Generate Next.js route types
        run: pnpm exec next typegen

      - name: Run TypeScript typecheck
        run: pnpm exec tsc --noEmit

      - name: Run tests
        run: pnpm test

      - name: Build production application
        run: pnpm build
