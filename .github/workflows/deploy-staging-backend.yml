name: Deploy staging backend

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-staging-backend:
    name: Deploy staging API and worker
    runs-on: ubuntu-latest
    environment: staging
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      RAILWAY_PROJECT_ID: ${{ secrets.RAILWAY_PROJECT_ID }}
      RAILWAY_API_SERVICE_ID: ${{ secrets.RAILWAY_API_SERVICE_ID }}
      RAILWAY_WORKER_SERVICE_ID: ${{ secrets.RAILWAY_WORKER_SERVICE_ID }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Require Railway deployment configuration
        shell: bash
        run: |
          for variable_name in \
            RAILWAY_TOKEN \
            RAILWAY_PROJECT_ID \
            RAILWAY_API_SERVICE_ID \
            RAILWAY_WORKER_SERVICE_ID
          do
            if [[ -z "${!variable_name}" ]]; then
              echo "${variable_name} is not configured in the staging environment." >&2
              exit 1
            fi
          done

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install Railway CLI
        run: npm install --global @railway/cli@5.47.2

      - name: Validate Railway staging API runtime configuration
        shell: bash
        run: |
          set -euo pipefail

          variables_json_path="$(mktemp)"
          trap 'rm -f "${variables_json_path}"' EXIT

          if ! railway variable list --json \
            --project "${RAILWAY_PROJECT_ID}" \
            --environment staging \
            --service "${RAILWAY_API_SERVICE_ID}" \
            >"${variables_json_path}" 2>/dev/null
          then
            echo "Unable to query Railway staging API configuration." >&2
            exit 1
          fi

          bash scripts/validate-railway-api-config.sh "${variables_json_path}"

      - name: Deploy API and worker
        shell: bash
        run: |
          set -euo pipefail

          deploy_and_wait() {
            local service_name="$1"
            local service_id="$2"
            local deployment_json
            local deployment_id
            local deployments_json
            local state=""
            local previous_state=""
            local deadline=$((SECONDS + 1800))

            echo "Triggering ${service_name} deployment."
            if ! deployment_json="$(timeout --foreground 10m railway up "$GITHUB_WORKSPACE/services/backend" --detach --json \
              --project "${RAILWAY_PROJECT_ID}" \
              --environment staging \
              --service "${service_id}" \
              --message "GitHub Actions ${GITHUB_SHA}")"
            then
              echo "Unable to trigger ${service_name} deployment." >&2
              return 1
            fi

            deployment_id="$(jq -er '.deploymentId | strings | select(length > 0)' <<<"${deployment_json}")"
            echo "${service_name} deployment ID: ${deployment_id}"

            while (( SECONDS < deadline )); do
              if ! deployments_json="$(timeout --foreground 30s railway deployment list --json --limit 100 \
                --project "${RAILWAY_PROJECT_ID}" \
                --environment staging \
                --service "${service_id}")"
              then
                echo "Unable to read ${service_name} deployment ${deployment_id} state." >&2
                return 1
              fi

              state="$(jq -r --arg deployment_id "${deployment_id}" \
                '.[] | select(.id == $deployment_id) | .status' <<<"${deployments_json}")"
              if [[ -z "${state}" ]]; then
                state="NOT_FOUND"
              fi

              if [[ "${state}" != "${previous_state}" ]]; then
                echo "${service_name} deployment ${deployment_id} state: ${state}"
                previous_state="${state}"
              fi

              case "${state}" in
                SUCCESS)
                  return 0
                  ;;
                SKIPPED)
                  echo "${service_name} deployment ${deployment_id} was skipped because Railway found no relevant source changes."
                  return 0
                  ;;
                FAILED|CRASHED|REMOVED|REMOVING)
                  echo "${service_name} deployment ${deployment_id} finished in failure state ${state}." >&2
                  return 1
                  ;;
                NOT_FOUND|QUEUED|WAITING|INITIALIZING|BUILDING|DEPLOYING)
                  sleep 10
                  ;;
                *)
                  echo "${service_name} deployment ${deployment_id} reached unexpected state ${state}." >&2
                  return 1
                  ;;
              esac
            done

            echo "Timed out after 30 minutes waiting for ${service_name} deployment ${deployment_id}." >&2
            return 1
          }

          deploy_and_wait "API" "${RAILWAY_API_SERVICE_ID}"
          deploy_and_wait "worker" "${RAILWAY_WORKER_SERVICE_ID}"
