name: Staging runtime smoke

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  staging-runtime-smoke:
    name: Smoke staging API and worker
    runs-on: ubuntu-latest
    environment: staging
    env:
      STAGING_API_BASE_URL: ${{ vars.STAGING_API_BASE_URL }}
      STAGING_SUPABASE_URL: ${{ vars.STAGING_SUPABASE_URL }}
      STAGING_SUPABASE_PUBLISHABLE_KEY: ${{ vars.STAGING_SUPABASE_PUBLISHABLE_KEY }}
      STAGING_SMOKE_EMAIL: ${{ secrets.STAGING_SMOKE_EMAIL }}
      STAGING_SMOKE_PASSWORD: ${{ secrets.STAGING_SMOKE_PASSWORD }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Run staging runtime smoke
        run: bash scripts/staging-runtime-smoke.sh
